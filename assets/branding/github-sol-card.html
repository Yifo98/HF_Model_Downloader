<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HF Model Downloader Sol</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1600px;
        height: 640px;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-items: center;
        color: #292337;
        font-family: "Avenir Next", "SF Pro Display", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: #f6f3fb;
      }

      .card {
        position: relative;
        width: 1600px;
        height: 640px;
        overflow: hidden;
        padding: 58px 66px;
        background:
          radial-gradient(circle at 12% 15%, rgba(255, 255, 255, 0.98) 0 13%, transparent 34%),
          radial-gradient(circle at 86% 12%, rgba(191, 246, 237, 0.82), transparent 29%),
          radial-gradient(circle at 82% 93%, rgba(255, 208, 193, 0.78), transparent 25%),
          linear-gradient(122deg, #f5f0ff 0%, #fdfaff 45%, #ecfbfa 100%);
      }

      .card::before,
      .card::after {
        position: absolute;
        border-radius: 999px;
        content: "";
        pointer-events: none;
      }

      .card::before {
        top: -238px;
        right: 140px;
        width: 560px;
        height: 560px;
        border: 1px solid rgba(114, 86, 169, 0.16);
        box-shadow:
          0 0 0 58px rgba(255, 255, 255, 0.18),
          0 0 0 116px rgba(39, 143, 130, 0.05);
      }

      .card::after {
        right: -110px;
        bottom: -310px;
        width: 580px;
        height: 580px;
        border: 1px solid rgba(245, 141, 119, 0.18);
        box-shadow: 0 0 0 72px rgba(255, 255, 255, 0.18);
      }

      .content {
        position: relative;
        z-index: 2;
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 66px;
        height: 100%;
      }

      .visual {
        position: relative;
        display: grid;
        place-items: center;
      }

      .visual-glow {
        position: absolute;
        width: 392px;
        height: 392px;
        border: 1px solid rgba(255, 255, 255, 0.82);
        border-radius: 108px;
        background:
          linear-gradient(145deg, rgba(255, 255, 255, 0.7), rgba(235, 226, 251, 0.42)),
          radial-gradient(circle at 35% 25%, #ffffff, transparent 55%);
        box-shadow:
          0 35px 80px rgba(78, 55, 122, 0.13),
          inset 0 1px rgba(255, 255, 255, 0.96);
        transform: rotate(-3deg);
      }

      .logo {
        position: relative;
        z-index: 2;
        width: 350px;
        height: 350px;
        object-fit: contain;
        filter: drop-shadow(0 26px 28px rgba(83, 62, 127, 0.18));
      }

      .orb {
        position: absolute;
        z-index: 3;
        border: 1px solid rgba(255, 255, 255, 0.9);
        border-radius: 999px;
        box-shadow: 0 12px 30px rgba(69, 55, 98, 0.12);
      }

      .orb--mint {
        right: 18px;
        bottom: 96px;
        width: 62px;
        height: 62px;
        background: linear-gradient(145deg, #d7fff7, #6bd3c4);
      }

      .orb--peach {
        top: 92px;
        left: 20px;
        width: 38px;
        height: 38px;
        background: linear-gradient(145deg, #ffe9e0, #f58d77);
      }

      .copy {
        display: flex;
        min-width: 0;
        flex-direction: column;
        justify-content: center;
      }

      .eyebrow {
        display: flex;
        align-items: center;
        gap: 13px;
        margin-bottom: 18px;
        color: #278f82;
        font-size: 19px;
        font-weight: 750;
        letter-spacing: 0.18em;
      }

      .eyebrow::before {
        width: 42px;
        height: 5px;
        border-radius: 99px;
        background: linear-gradient(90deg, #53cfbd, #f58d77);
        content: "";
      }

      h1 {
        margin: 0;
        color: #2d263d;
        font-size: 78px;
        font-weight: 760;
        letter-spacing: -0.045em;
        line-height: 1.02;
      }

      h1 span {
        color: #7256a9;
      }

      .lead {
        max-width: 880px;
        margin: 22px 0 28px;
        color: #5d546c;
        font-size: 26px;
        font-weight: 520;
        letter-spacing: 0.01em;
        line-height: 1.55;
      }

      .flow {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 11px;
        max-width: 900px;
      }

      .flow-step {
        display: grid;
        grid-template-columns: 38px 1fr;
        align-items: center;
        min-width: 0;
        padding: 13px 15px;
        border: 1px solid rgba(114, 86, 169, 0.11);
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.64);
        box-shadow: inset 0 1px rgba(255, 255, 255, 0.92);
      }

      .flow-step b {
        display: grid;
        width: 29px;
        height: 29px;
        place-items: center;
        border-radius: 10px;
        color: #7256a9;
        font-size: 13px;
        background: #eee7fb;
      }

      .flow-step span {
        overflow: hidden;
        color: #4c445d;
        font-size: 17px;
        font-weight: 690;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .proofs {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }

      .proof {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        padding: 9px 13px;
        border-radius: 999px;
        color: #625874;
        font-size: 14px;
        font-weight: 650;
        background: rgba(255, 255, 255, 0.54);
      }

      .proof::before {
        width: 8px;
        height: 8px;
        border-radius: 99px;
        background: #53bbaa;
        box-shadow: 0 0 0 4px rgba(83, 187, 170, 0.12);
        content: "";
      }

      .version {
        position: absolute;
        top: 34px;
        right: 42px;
        z-index: 3;
        padding: 10px 15px;
        border: 1px solid rgba(114, 86, 169, 0.12);
        border-radius: 999px;
        color: #7256a9;
        font-size: 14px;
        font-weight: 750;
        letter-spacing: 0.08em;
        background: rgba(255, 255, 255, 0.58);
      }
    </style>
  </head>
  <body>
    <main class="card" aria-label="HF Model Downloader 5.6 Sol GitHub brand card">
      <div class="version" id="release-version">RELEASE</div>
      <div class="content">
        <section class="visual" aria-label="Sol application icon">
          <div class="visual-glow"></div>
          <img class="logo" src="../logo-sol.png" alt="" />
          <span class="orb orb--mint"></span>
          <span class="orb orb--peach"></span>
        </section>

        <section class="copy">
          <div class="eyebrow">HF MODEL DOWNLOADER</div>
          <h1><span>Sol</span> · 模型下载工作台</h1>
          <p class="lead">把 Hugging Face 仓库整理成一条清晰、可信、可恢复的桌面下载流程。</p>

          <div class="flow" aria-label="产品工作流">
            <div class="flow-step"><b>01</b><span>连接仓库</span></div>
            <div class="flow-step"><b>02</b><span>策展筛选</span></div>
            <div class="flow-step"><b>03</b><span>安全下载</span></div>
            <div class="flow-step"><b>04</b><span>实时监控</span></div>
          </div>

          <div class="proofs">
            <span class="proof">固定版本清单</span>
            <span class="proof">SHA-256 校验</span>
            <span class="proof">Windows 项目自包含</span>
          </div>
        </section>
      </div>
    </main>
  </body>
</html>
